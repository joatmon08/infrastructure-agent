[project]
name = "infrastructure-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "kubernetes>=36.0.3",
    "pytest>=9.1.1",
]

[tool.pytest]
markers = [
    "kubernetes",
    "vault",
    "summarizer",
]
filterwarnings = [
    "ignore:Unverified HTTPS request is being made.*:urllib3.exceptions.InsecureRequestWarning",
]